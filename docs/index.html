<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Login Form</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }\n        .hidden { display: none; }\n        .dashboard { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <h2>Login</h2>\n        <form id="loginForm">\n            <label for="email">Email:</label>\n            <input type="email" id="email" value="test1@cmd.cd" required />\n            <label for="service">Select Service:</label>\n            <select id="service" required>\n                <option value="patient_management">Patient Management</option>\n                <option value="care_plans">Care Plans</option>\n            </select>\n            <button type="submit">Login</button>\n        </form>\n        <div class="dashboard hidden" id="dashboard">\n            <h2>Dashboard</h2>\n            <p>Welcome to the Patient Management and Care Plans dashboard.</p>\n        </div>\n    </div>\n    <script>\n        document.getElementById('loginForm').onsubmit = function(event) {\n            event.preventDefault(); // Prevent default form submission\n            var email = document.getElementById('email').value;\n            var service = document.getElementById('service').value;\n            if (email === 'test1@cmd.cd' && service) {\n                document.getElementById('dashboard').classList.remove('hidden');\n                document.getElementById('loginForm').classList.add('hidden');\n            } else {\n                alert('Invalid login. Please try again.');\n            }\n        };\n    <\/script>\n</body>\n</html>
