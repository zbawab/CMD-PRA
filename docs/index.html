<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management App</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>Patient Management Application</h1>
    </header>
    <main>
        <section id="login-section">
            <h2>Login</h2>
            <form id="login-form" onsubmit="login(event);">
                <label for="username">Username:</label>
                <input type="text" id="username" required />
                <label for="password">Password:</label>
                <input type="password" id="password" required />
                <button type="submit">Login</button>
            </form>
        </section>
        <section id="patient-management-section" class="hidden">
            <h2>Patient Management</h2>
            <input type="text" id="search" placeholder="Filter by service" onkeyup="loadPatients();" />
            <ul id="patient-list"></ul>
        </section>
        <section id="evaluation-section" class="hidden">
            <h2>Evaluation</h2>
            <form id="evaluation-form" onsubmit="submitEvaluation(event);">
                <label for="patient">Patient:</label>
                <input type="text" id="patient" required />
                <label for="evaluation">Evaluation:</label>
                <textarea id="evaluation" required></textarea>
                <button type="submit">Submit Evaluation</button>
            </form>
        </section>
        <section id="care-plans-section" class="hidden">
            <h2>Care Plans</h2>
            <p>List or manage care plans here.</p>
        </section>
    </main>
    <script>
        function login(event) {
            event.preventDefault();
            // Simulate login functionality
            const username = document.getElementById('username').value;
            if (username) {
                document.getElementById('login-section').classList.add('hidden');
                showSection('patient-management-section');
                loadPatients();
            }
        }

        function showSection(sectionId) {
            document.querySelectorAll('section').forEach((section) => {
                section.classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
        }

        function loadPatients() {
            // Simulated patient data
            const patients = [
                { name: 'John Doe', service: 'Cardiology' },
                { name: 'Jane Smith', service: 'Pediatrics' },
            ];
            const filter = document.getElementById('search').value.toLowerCase();
            const patientList = document.getElementById('patient-list');
            patientList.innerHTML = '';
            patients.filter(patient => patient.service.toLowerCase().includes(filter)).forEach(patient => {
                const li = document.createElement('li');
                li.textContent = patient.name + ' - ' + patient.service;
                patientList.appendChild(li);
            });
        }

        function submitEvaluation(event) {
            event.preventDefault();
            const patient = document.getElementById('patient').value;
            const evaluation = document.getElementById('evaluation').value;
            // Logic to submit the evaluation
            alert('Evaluation for ' + patient + ' has been submitted.');
            document.getElementById('evaluation-form').reset();
        }
    </script>
</body>
</html>
